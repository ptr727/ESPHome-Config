# STATUS (2026-06-08): Controller remains physically POWERED OFF, intentionally.
# Root cause CONFIRMED: the two self-opening incidents were caused by the boot-window GPIO1 UART glitch, Hazard A below, not by any Konnected or gdolib code change.
# This opener is a Security+ 1.0 unit, which is exactly the type susceptible to that glitch.
# The reboot_timeout 0s settings mitigate the reboot loop that exposed it.
# A single unexpected reset can still trigger the glitch on a Sec+ 1.0 opener, so the residual risk is not zero.
# The controller stays off, and the opener is to be replaced with a newer Security+ unit that is not susceptible to this reboot glitch.
# This config will be re-enabled against that new opener.
# The upstream YAML is now back on latest, with no commit pin.
# The incident record and the upstream reports are:
#   - https://github.com/ptr727/ESPHome-Config/issues/29           (incident report)
#   - https://github.com/konnected-io/konnected-esphome/issues/112 (filed upstream)
#   - https://github.com/konnected-io/konnected-esphome/issues/93  (similar pattern, older)
#
# Confirmed cause:
#
#   Hazard A: Boot-window GPIO1 UART glitch  (THIS IS THE CAUSE)
#     GPIO1, the Sec+ UART TX line, is uncontrolled between esp_restart() and secplus_gdo::setup().
#     A stray pulse on that line is decoded as a wall-button press.
#     The Konnected maintainer confirmed that this mechanism triggers on Security+ 1.0 openers, which latch on momentary low pulses.
#     https://github.com/konnected-io/konnected-esphome/issues/112
#     This device is a Sec+ 1.0 opener, so the glitch fully explains both incidents.
#     Each spurious opening correlated with a reboot or OTA, and the 15-minute reboot loop gave the boot window roughly 96 chances a day to fire whenever HA was unreachable.
#
#   Hazard B: gdolib v1.1.0 gdo_door_move_to_target() rewrite  (RULED OUT)
#     The earlier theory was that the v1.1.0 routing through gdo_door_open and gdo_door_close could send a direct OPEN or CLOSE on the Sec+ wire.
#     That is now ruled out.
#     The only v1.1.0 changes are inside gdo_door_move_to_target, which is reached only through an explicit "set position to X%" command.
#     Incident 1 happened while HA was disconnected, so no caller was possible, and Incident 2 had no manual set-position command, so the gdolib change was never in the path.
#     That is why the commit pin has been removed and the latest upstream YAML is synced.
#
# Mitigations applied here:
#   - api.reboot_timeout and wifi.reboot_timeout set to 0s, the actual fix, which stops the 15-minute reboot loop that exposed the boot-window UART glitch.
#   - project_name and project_version overridden in konnected-blaq.yaml, which blocks the ESPHome Update Manager from force-flashing.

# https://esphome.io/components/substitutions
substitutions:
  device_name: garage-door-controller
  device_friendly_name: "Garage Door Controller"
  # See the STATUS block at the top of this file.
  # The reboot_timeout 0s settings remove the roughly 96 reboots a day boot-window hazard whenever HA is unreachable.
  api_reboot_timeout: "0s"
  wifi_reboot_timeout: "0s"

# https://esphome.io/components/packages
packages:
  blaq: !include templates/konnected-blaq.yaml
