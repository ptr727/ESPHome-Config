# https://esphome.io/components/substitutions
substitutions:
  device_name: garage-gate-fan-controller
  device_friendly_name: "Garage Gate Fan Controller"
  fan_temperature_high: "28.0" # ~80F

# https://esphome.io/components/packages
packages:
  norvi: !include templates/norvi-enet-ae06-r.yaml

# https://esphome.io/components/esphome
esphome:
  on_boot:
    - priority: -100
      then:
        - climate.control:
            id: thermo
            mode: cool

# https://esphome.io/components/one_wire
one_wire:
  # Use expansion port Pin6 GPIO15 for 1-wire protocol
  # GPIO15 is a strapping pin, the 1-wire bus is wired and working, so the warning is acknowledged not silenced blindly.
  - platform: gpio
    pin:
      number: GPIO15
      ignore_strapping_warning: true

# https://esphome.io/components/sensor
sensor:

  # https://esphome.io/components/sensor/dallas_temp
  - platform: dallas_temp
    address: 0x1500000DC56AFC28
    name: Temperature
    id: temp
    update_interval: 15s
    # https://esphome.io/components/sensor#sliding-window-moving-average-filter
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 3

  # https://esphome.io/components/sensor/pulse_counter
  # Device class, icon, and accuracy are not inherited from main sensor, manually repeat
  # https://developers.home-assistant.io/docs/core/entity/sensor/#available-device-classes
  # https://developers.home-assistant.io/docs/core/entity/sensor/#available-state-classes
  # Water and Gas device class does not support flow rates
  - platform: pulse_counter
    pin:
      # Use input 0 for water
      number: GPIO21
      inverted: true
    use_pcnt: false
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    internal_filter: 100ms
    unit_of_measurement: gal/min
    name: "Water Meter"
    icon: mdi:water
    device_class: volume_flow_rate
    state_class: measurement
    filters:
      - multiply: 10
    total:
      name: "Water Meter Total"
      icon: mdi:water
      device_class: water
      state_class: total_increasing
      id: water_total
      unit_of_measurement: gal
      filters:
        - multiply: 10

  - platform: pulse_counter
    pin:
      # Use input 1 for gas
      number: GPIO14
      inverted: true
    use_pcnt: false
    count_mode:
      rising_edge: DISABLE
      falling_edge: INCREMENT
    internal_filter: 100ms
    unit_of_measurement: ft³/min
    name: "Gas Meter"
    icon: mdi:fire
    device_class: volume_flow_rate
    state_class: measurement
    filters:
      - multiply: 10
    total:
      name: "Gas Meter Total"
      icon: mdi:fire
      device_class: gas
      state_class: total_increasing
      id: gas_total
      unit_of_measurement: ft³
      filters:
      - multiply: 10

  # https://esphome.io/components/sensor/template
  - platform: template
    name: "Water Meter Total (m³)"
    icon: mdi:water
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 3
    unit_of_measurement: m³
    # Convert gal to m³
    lambda: |-
      return id(water_total).state / 264.2;

  - platform: template
    name: "Gas Meter Total (m³)"
    icon: mdi:fire
    device_class: gas
    state_class: total_increasing
    accuracy_decimals: 3
    unit_of_measurement: m³
    # Convert ft³ to m³
    lambda: |-
      return id(gas_total).state / 35.315;

# https://esphome.io/components/climate
climate:

  # https://esphome.io/components/climate/thermostat
  - platform: thermostat
    name: "Thermostat Controller"
    id: thermo
    sensor: temp
    min_cooling_off_time: 60s
    min_cooling_run_time: 60s
    min_idle_time: 60s
    cool_action:
      - logger.log: "Thermostat : Cool Action, Turning Relay On."
      - switch.turn_on: relay_1
    idle_action:
      - logger.log: "Thermostat : Idle Action, Turning Relay Off."
      - switch.turn_off: relay_1
    default_preset: Default
    preset:
      - name: Default
        default_target_temperature_high: ${fan_temperature_high}
    visual:
      min_temperature: 20.0
      max_temperature: 40.0
      temperature_step: 0.5

# https://esphome.io/components/font
font:
  - file: "gfonts://Roboto"
    id: font_line
    size: 14

# https://esphome.io/components/display/ssd1306
display:
  - platform: ssd1306_i2c
    id: board_display
    i2c_id: board_i2c
    model: SSD1306_128X64
    address: 0x3c
    lambda: |-
      // Three lines, each centered vertically on a quarter of the panel height.
      const int slot = it.get_height() / 4;
      const float celsius = std::isnan(id(temp).state) ? 0.0f : id(temp).state;
      it.printf(0, slot, id(font_line), TextAlign::CENTER_LEFT, "IP: %s", id(wifi_ip).state.c_str());
      it.strftime(0, 2 * slot, id(font_line), TextAlign::CENTER_LEFT, "Time: %H:%M:%S", id(homeassistant_time).now());
      it.printf(0, 3 * slot, id(font_line), TextAlign::CENTER_LEFT, "Temp: %.2f°C", celsius);
