# CI compile-test for templates/waveshare-esp32-s3-eth-camera.yaml
# The camera is an overlay, not a standalone device.
# Composed on the board template, as waveshare-esp32-s3-eth-camera.yaml documents.
substitutions:
  # The template basename plus -test is 34 characters, over the 31 character device name limit.
  device_name: waveshare-s3-eth-camera-test
  device_friendly_name: "Waveshare ESP32-S3-ETH Camera Test"

packages:
  device: !include ../templates/waveshare-esp32-s3-eth.yaml
  camera: !include ../templates/waveshare-esp32-s3-eth-camera.yaml
