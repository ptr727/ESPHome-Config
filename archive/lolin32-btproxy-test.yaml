# https://esphome.io/components/substitutions
substitutions:
  device_name: lolin32-btproxy-test
  device_comment: "WEMOS LOLIN32 Lite Bluetooth Proxy"

# https://esphome.io/components/packages
packages:
  feather: !include templates/wemos-lolin32-lite.yaml

# https://esphome.io/components/esp32_ble_tracker
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# https://esphome.io/components/bluetooth_proxy
bluetooth_proxy:
  active: true
