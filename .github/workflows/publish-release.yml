name: Publish project release action

on:
  workflow_dispatch:

# A publish is a deliberate dispatch, so runs serialize on one group and queue rather than cancel.
# That leaves no run with a half-created GitHub release.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:

  assert-dispatch-ref:
    name: Assert dispatch ref job
    runs-on: ubuntu-latest
    steps:
      - name: Assert dispatch ref step
        run: |
          set -Eeuo pipefail
          if [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "develop" ]; then
            echo "::error::Dispatch publish-release from main (release) or develop (prerelease); got ${{ github.ref_name }}."
            exit 1
          fi

  plan:
    name: Plan release job
    needs: [assert-dispatch-ref]
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@f3bfdb43aef34750e1a997e68ddfb1364b2bd097 # 2.0.416
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  validate:
    name: Validate sources job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@f3bfdb43aef34750e1a997e68ddfb1364b2bd097 # 2.0.416
    permissions:
      contents: read

  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@f3bfdb43aef34750e1a997e68ddfb1364b2bd097 # 2.0.416
    permissions:
      contents: write
      actions: write
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      nuget: false
      dockerhub: false
      enable_docker: false
      enable_nuget: false
      enable_pypi: false
      enable_dotnet_publish: false
      expect_release_assets: false
