name: Test pull request action

# Source lint plus a change-gated compile test, run on the ptr727/esphome-nonroot image the repo deploys.
# - template-compile-test builds the example devices, which between them compose every published template.
# - test/easystart.yaml also covers the easystart external component.
# - Each leg then lints the build it compiled, failing on a compiler warning in this repository's own code.
# It costs minutes of esp-idf build, so it runs only when what it covers moves.
# Operational model.
# - develop takes direct signed commits, where push runs advisory CI.
# - main is the promoted snapshot, where the develop -> main promotion PR runs the enforced gate.
# - check-workflow-status is the ruleset-bound required check, rename it and the ruleset context together.
# The pull_request branch set names both, since naming main alone matches nothing on a PR into develop.
# That leaves the validation job unstarted and the aggregator unreported.
# The PR then reads mergeable with an empty check list, the false clean WORKFLOW.md D1.2 forbids.
# The duplicate run it costs, once on the PR and again on the push when the merge lands, is accepted.
# The concurrency group keys on github.ref, and the two runs sit in different groups.
# A pull_request run is refs/pull/<n>/merge where the push run is refs/heads/develop, so neither cancels the other.

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  validate:
    name: Validate sources job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@ab9d050b55e246c8e5563ac1264709d1c33b5552 # 2.0.1198
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Change gate for the compile test, plus the template matrix definition.
  # An esp-idf build costs minutes, so gate on what the test covers.
  # An undeterminable diff runs everything.
  changes:
    name: Detect build-affecting changes job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      template-test: ${{ steps.filter.outputs.template-test }}
      template-configs: ${{ steps.configs.outputs.template-configs }}

    steps:

      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter changed paths step
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          run_all() {
            echo "template-test=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A manual run has no diff, and is also how a full rebuild sweep is requested.
          [[ "$EVENT" == "workflow_dispatch" ]] && run_all
          FROM="$BEFORE"
          [[ "$EVENT" == "pull_request" ]] && FROM="$BASE_SHA"
          # A new branch (all-zeros before) or an unreachable base - build everything.
          if [[ -z "$FROM" || "$FROM" =~ ^0+$ ]] || ! DIFF=$(git diff --name-only "$FROM" "$AFTER" 2>/dev/null); then
            run_all
          fi
          WORKFLOW='\.github/workflows/test-pull-request\.yml$'
          # The test/ tree hosts the example devices, and test/easystart.yaml compiles easystart/components.
          # A top-level YAML is a deployed device config, compiled alongside the example devices.
          # The compile lint runs in the same legs, so a change to it reruns them too.
          if grep -qE "^(templates/|test/|easystart/components/|tools/compile-lint/|[^/]+\.yaml$|$WORKFLOW)" <<<"$DIFF"; then
            echo "template-test=true" >> "$GITHUB_OUTPUT"
          else
            echo "template-test=false" >> "$GITHUB_OUTPUT"
          fi

      # Build the compile matrix from test/ and the top-level device configs, so a new config is picked up without editing the matrix.
      # Every device template must be included by an example device, else a new template would go silently untested.
      # Utility includes are pulled in transitively by the device templates and need no example device.
      - name: List template test configs step
        id: configs
        env:
          UTILITY: api basic common debug ethernet-sensor logger max17048 min-version ota rgb-led-status secrets temperature time wifi
        run: |
          set -Eeuo pipefail
          missing=()
          for path in templates/*.yaml; do
            name="$(basename "$path" .yaml)"
            case " $UTILITY " in *" $name "*) continue;; esac
            grep -qE "^[^#]*(!include|file:) +\.\./templates/$name\.yaml" test/*.yaml || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Templates that no example device in test/ includes: ${missing[*]}"
            exit 1
          fi
          # A flashed example device runs on a bench with no Home Assistant and maybe no network, so it must not reboot for lack of either.
          rebooting=()
          for path in test/*.yaml; do
            grep -qE "^  api_reboot_timeout: [\"']?0s[\"']?( *#.*)?\$" "$path" && grep -qE "^  wifi_reboot_timeout: [\"']?0s[\"']?( *#.*)?\$" "$path" || rebooting+=("$path")
          done
          if (( ${#rebooting[@]} > 0 )); then
            echo "Example devices not setting api_reboot_timeout and wifi_reboot_timeout to 0s: ${rebooting[*]}"
            exit 1
          fi
          # A deployed device config compiles too, since its own lambdas and substitutions reach no example device.
          # The shell glob skips dot-named YAML, which is not a device config.
          CONFIGS="$(printf '%s\n' test/*.yaml *.yaml | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "Compile matrix: $CONFIGS"
          echo "template-configs=$CONFIGS" >> "$GITHUB_OUTPUT"

  # Compile every example device, each composing one board template and any overlays it carries, and every deployed device config.
  # The test/ tree holds the configs, and the Device Builder scan is non-recursive, so they are not listed as devices.
  # The matrix comes from the changes job, which also enforces that every template is included by an example device.
  # Turning fail-fast off keeps one broken template from masking the others.
  template-compile-test:
    name: Compile ${{ matrix.config }} job
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: ${{ needs.changes.outputs.template-test == 'true' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.changes.outputs.template-configs) }}

    steps:

      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Templates resolve !secret via templates/secrets.yaml, which re-exports the root secrets.yaml.
      # The secrets._yaml file supplies the key names.
      # The encryption key is generated here, so no usable key is committed.
      - name: Create dummy secrets step
        run: |
          set -Eeuo pipefail
          cp secrets._yaml secrets.yaml
          key="$(python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())')"
          sed -i "s|REPLACE_WITH_BASE64_32_BYTE_KEY|$key|" secrets.yaml

      # The cache sits at a fixed path, and the log there names the build path, so the lint step finds the build.
      - name: Compile config step
        run: |
          set -Eeuo pipefail
          cache="$RUNNER_TEMP/esphome-cache"
          mkdir -p "$cache"
          chmod -R 0777 "$cache" .
          docker run --rm --user 1000:1000 \
            --volume "$PWD":/config \
            --volume "$cache":/cache \
            ptr727/esphome-nonroot:latest \
            bash -c '
              set -Eeuo pipefail
              /entrypoint/cache.sh
              esphome config /config/${{ matrix.config }} > /dev/null
              esphome compile /config/${{ matrix.config }} 2>&1 | tee /cache/compile.log
            '

      # Recompile the generated main.cpp syntax-only with stricter warnings, keeping what lands in this repository's code.
      # ESPHome's own warnings in the compile log are findings too, unless tools/compile-lint/allowed-warnings.yaml lets them through.
      # A finding annotates its YAML lambda line or component file, and fails the leg, per OPERATIONS.md "Compile Lint".
      # It runs as the runner's own user, so it can append to the step summary file mounted into the container.
      - name: Lint compiled code step
        run: |
          set -Eeuo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD":/config \
            --volume "$RUNNER_TEMP/esphome-cache":/cache \
            --volume "$GITHUB_STEP_SUMMARY":/summary.md \
            --env PYTHONPATH=/config/tools/compile-lint/src \
            ptr727/esphome-nonroot:latest \
            bash -c '
              set -Eeuo pipefail
              python3 -m compile_lint --config-root /config --annotate --summary /summary.md --from-log /cache/compile.log
            '

  # GitHub Actions does not support required status checks on conditional jobs.
  # A single always-run aggregator gates the merge instead.
  # Its name is the ruleset-bound required status-check context, rename it and the ruleset context together.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [ validate, changes, template-compile-test ]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          if [[ "${{ needs.validate.result }}" != "success" ]]; then
            echo "Job 'validate' did not succeed (${{ needs.validate.result }}); refusing to pass."
            exit 1
          fi
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Job 'changes' did not succeed (${{ needs.changes.result }}); refusing to pass."
            exit 1
          fi
          # The compile job is skipped when the change gate says nothing it covers moved.
          # A skip must still pass, and anything else short of success blocks, a cancelled leg included.
          result="${{ needs.template-compile-test.result }}"
          if [[ "$result" != "success" && "$result" != "skipped" ]]; then
            echo "Job 'template-compile-test' did not succeed ($result); refusing to pass."
            exit 1
          fi
