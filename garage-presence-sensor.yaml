substitutions:
  device_name: garage-presence-sensor
  device_friendly_name: "Garage Presence Sensor"

packages:
  ceilsense: !include templates/smarthome-ceilsense.yaml

# https://esphome.io/components/sensor/ld2412
# Per-gate energy for siting work, the vendor package exposes gate 0 only.
# Disabled by default so the 1 Hz stream stays out of the recorder until a tuning session enables it.
sensor:
  - platform: ld2412
    gate_1:
      move_energy:
        name: "Gate 1 Move Energy"
        disabled_by_default: true
      still_energy:
        name: "Gate 1 Still Energy"
        disabled_by_default: true
