# https://esphome.io/components/number/ld2412
# Per-gate sensitivity, the only way to mute a distance band, and unexposed by the vendor package.
# All fourteen gates are declared because a threshold write sends the whole array and dereferences every entry.
# esphome/esphome#18194 fixes that dereference and was verified on this device on 2026-08-08.
# Revisit declaring only the gates in use once the fix ships in a release.
number:
  - platform: ld2412
    gate_0:
      move_threshold:
        name: "Gate 0 Move Threshold"
      still_threshold:
        name: "Gate 0 Still Threshold"
    gate_1:
      move_threshold:
        name: "Gate 1 Move Threshold"
      still_threshold:
