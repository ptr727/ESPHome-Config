# EasyStart live BLE monitor, a member of the repository's uv workspace.
# Lint, type-check, and test config is shared and lives in the root pyproject.toml.

[project]
name = "easystart-monitor"
version = "1.0.0"
description = "Live BLE monitor for the Micro-Air EasyStart soft-starter."
requires-python = ">=3.13"
dependencies = ["bleak>=0.22"]

[project.scripts]
easystart-monitor = "easystart_monitor.monitor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
