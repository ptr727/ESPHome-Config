# External usage:
# packages:
#   easystart_1:
#     url: https://github.com/ptr727/ESPHome-Config
#     ref: main
#     files:
#       - path: templates/easystart.yaml
#         vars:
#           easystart_id: easystart_1
#           easystart_mac: "AA:BB:CC:DD:EE:01"
#           easystart_label: "Compressor 1"
# - Needs the easystart external component and a board running esp32_ble_tracker, see test/easystart.yaml.

# Required substitutions:
# - easystart_id
# - easystart_mac
# - easystart_label

# Optional substitutions:
# - easystart_voltage (240, scales the estimated power, set it to the measured line voltage)
# - easystart_power_factor (1.0, scales the estimated power, set it to the measured power factor of the load)
# - easystart_update_interval (5s, the live frame poll period, a lower value refreshes the sensors faster at the cost of more BLE traffic)
# - easystart_rssi_update_interval (60s, drop it to a few seconds to site a proxy)

# https://www.microair.net/products/easystart-flex-home-ac-soft-starter
# https://esphome.io/components/ble_client
# ../easystart/README.md

# The esp32_ble max_connections must be set to 3 for the BT proxy plus 1 per easystart device.

substitutions:
  easystart_voltage: "240"
  easystart_power_factor: "1.0"
  easystart_update_interval: "5s"
  easystart_rssi_update_interval: "60s"

# https://esphome.io/components/ble_client
ble_client:
  - id: ${easystart_id}
    mac_address: ${easystart_mac}
    auto_connect: true

# ../easystart/PROTOCOL.md
easystart:
  - ble_client_id: ${easystart_id}
    update_interval: ${easystart_update_interval}
    line_voltage: ${easystart_voltage}
    power_factor: ${easystart_power_factor}
    running:
      name: "${easystart_label} Running"
    current:
      name: "${easystart_label} Current"
    power:
      name: "${easystart_label} Power"
      id: ${easystart_id}_power
    frequency:
      name: "${easystart_label} Line Frequency"
    last_start_peak:
      name: "${easystart_label} Last Start Peak"
    scpt_delay:
      name: "${easystart_label} Short-Cycle Delay"
    system_state:
      name: "${easystart_label} System State"
    total_starts:
      name: "${easystart_label} Total Starts"
    total_faults:
      name: "${easystart_label} Total Faults"
    learned_starts:
      name: "${easystart_label} Learned Starts"

# https://esphome.io/components/ble_client
sensor:
  - platform: ble_client
    ble_client_id: ${easystart_id}
    type: rssi
    name: "${easystart_label} Signal Strength"
    entity_category: diagnostic
    update_interval: ${easystart_rssi_update_interval}
