# External usage:
# packages:
#   device: github://ptr727/ESPHome-Config/templates/smarthome-ceilsense.yaml@main
# - Secrets resolve from a secrets.yaml beside the including config, see secrets._yaml for the names.

# Required substitutions:
# device_name
# device_friendly_name

# SmartHomeShop CeilSense v1 Complete (WiFi, LD2412 + SCD4x)
# https://ceilsense.nl/en/
# https://docs.smarthomeshop.io/en/ceilsense/ceilsense-index-en
# https://github.com/smarthomeshop/ceilsense
# https://github.com/smarthomeshop/ceilsense/tree/main/ceilsense-v1

# Assembled from the base, ld2412, and scd4x sub-packages rather than the vendor's complete entry point.
# That entry point pulls in a wifi.yaml whose on_boot list forces the Improv and BLE stack.
# The list carries no ids, and a list item without one cannot be removed.
# ../OPERATIONS.md "SmartHome CeilSense" covers the strip in full.

substitutions:
  # base.yaml expects these for esphome.name / friendly_name
  name: ${device_name}
  friendly_name: ${device_friendly_name}

# https://esphome.io/components/esphome
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  name_add_mac_suffix: false
  # Removed to stop the ESPHome Update Manager auto updating.
  # Safe here because no sub-package reads the ESPHOME_PROJECT_NAME or ESPHOME_PROJECT_VERSION macros.
  project: !remove
  # Stands in for the unimported wifi.yaml boot phase 1, without its BLE actions.
  # The remaining self-test phases come from the sub-packages' own on_boot entries.
  on_boot:
    - priority: 600
      then:
        - lambda: 'id(startup_phase) = 1;'
        - light.turn_on:
            id: status_led
            brightness: 80%
            effect: "Circular Loading Effect"
        - wait_until:
            condition:
              wifi.connected:
            timeout: 30s

# https://esphome.io/components/packages
# The vendor's complete-wifi-ld2412 variant is these three plus its own wifi.yaml.
# The header explains why that one is left out.
packages:
  base:   github://smarthomeshop/ceilsense/ceilsense-v1/base.yaml@main
  ld2412: github://smarthomeshop/ceilsense/ceilsense-v1/packages/ld2412.yaml@main
  scd4x:  github://smarthomeshop/ceilsense/ceilsense-v1/packages/scd4x.yaml@main
  minversion: !include min-version.yaml
  time: !include time.yaml

# Whole-key removals from base.yaml, dropping the web UI and the firmware-update entity.
web_server:   !remove
update:       !remove   # http_request firmware-update entity (id: firmware_update)
http_request: !remove   # only consumed by `update` + the ota_http_request platform, both removed

# Extends base.yaml's ota_esphome entry to add a password.
# The http_request OTA platform goes, since it depends on the removed http_request.
ota:
  - id: !extend ota_esphome
    password: !secret ota_password
  - id: !remove ota_http_request

# Extend base.yaml's bare api: with encryption.
api:
  encryption:
    key: !secret api_encryption_key

# Removed by id, not as a whole key, because packages/ld2412.yaml adds its own selects to this list.
select:
  - id: !remove firmware_selector

# Removed by id so the restart, factory-reset, LD2412, and SCD4x buttons in the same list stay.
button:
  - id: !remove update_firmware

# Remove the glue scripts driving the firmware selector/update.
# Both reference firmware_selector and firmware_update, removed above.
# Their only caller was the firmware_selector select, also removed.
script:
  - id: !remove sync_selected_firmware_source
  - id: !remove check_firmware_update_when_online

# Pointless with no Bluetooth stack, since it only gated the unimported wifi.yaml ble.disable call.
# The "LD2412 Debug Mode" switch in the same list stays.
switch:
  - id: !remove ble_disable_after_boot

# Local-environment WiFi (base.yaml supplies no wifi: of its own).
wifi:
  ssid:     !secret wifi_ssid
  password: !secret wifi_password
  domain:   !secret wifi_domain
  reboot_timeout: 15min
  min_auth_mode: WPA2

# Match templates/basic.yaml convention: Uptime in minutes + API-connected
# Status, plus the WiFi Signal diagnostic that wifi.yaml used to provide.
sensor:
  - platform: uptime
    name: "Uptime"
    unit_of_measurement: min
    filters:
      - lambda: return x / 60.0;
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
    disabled_by_default: true

binary_sensor:
  - platform: status
    name: "Status"
