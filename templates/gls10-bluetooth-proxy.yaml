# Required substitutions:
# device_name
# device_friendly_name

# https://www.gl-inet.com/products/gl-s10/
# https://static.gl-inet.com/www/images/products/datasheet/s10_datasheet_20230602.pdf
# https://blakadder.com/gl-s10/
# https://github.com/blakadder/bluetooth-proxies/blob/main/gl-s10_v2.yaml
# https://devices.esphome.io/devices/GL-iNet-GL-S10

# Warning: Do not connect USB power and POE power at the same time!

# Board Tested: GL-S10-v2.1 / 2022-05-05

# ESP32-D0WD, 4MB Flash, no PSRAM
# The vendor claim of 8MB PSRAM does not hold, this board has none.
# Boot warns the bootloader is too old for OTA rollback and SRAM1 as IRAM, clearing it needs one USB flash.
# Do not set sram1_as_iram before that USB flash, on an old bootloader it hard bricks the device.

# GPIO32 : Globe LED (Green) : ESPHome status, lit is healthy and flashing is a warning or error
# GPIO14 : Power LED (White) : On from boot
# GPIO12 : BLE LED (Green) : On when Ethernet is connected

# GPIO33 : Reset button (Not connected to physical reset) : Runs safe_reboot()

# IP101 RMII Ethernet
# GPIO23 : mdc
# GPIO18: mdio
# GPIO0_IN : clk
# GPIO5 : power

# I2C - Header
# GPIO15 : sda
# GPIO13 : scl

# https://esphome.io/components/esphome
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  on_boot:
    then:
      - output.turn_on: power_led

# https://esphome.io/components/esp32
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# https://esphome.io/components/packages
packages:
  api: !include api.yaml
  basic: !include basic.yaml
  debug: !include debug.yaml
  ethernetsensor: !include ethernet-sensor.yaml
  logger: !include logger.yaml
  ota: !include ota.yaml
  time: !include time.yaml

# https://esphome.io/components/ethernet
ethernet:
  type: IP101
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_EXT_IN
  phy_addr: 1
  # GPIO0 and GPIO5 are strapping pins and warn at validation.
  # The ethernet schema takes bare pin numbers, so ignore_strapping_warning has nowhere to attach here.
  power_pin: GPIO5

# https://esphome.io/components/esp32_ble_tracker
esp32_ble_tracker:
  scan_parameters:
    active: true

# https://esphome.io/components/bluetooth_proxy
bluetooth_proxy:
  active: true

# https://esphome.io/components/status_led
# The LED is active low and the pin is deliberately not inverted, so lit means healthy.
status_led:
  pin:
    number: GPIO32

# Reset button
# https://esphome.io/components/binary_sensor/gpio
binary_sensor:
  - platform: gpio
    id: reset_button
    icon: mdi:restart
    pin:
      number: GPIO33
      inverted: true
    filters:
      - delayed_on: 10ms
    on_press:
      then:
        # https://github.com/esphome/esphome/blob/dev/esphome/core/application.h
        - lambda: App.safe_reboot();

# LEDs
output:
  - platform: gpio
    id: power_led
    pin:
      number: GPIO14
      inverted: true
  - platform: gpio
    id: ble_led
    pin:
      number: GPIO12 # Strapping pin, fixed board wiring, so the warning is acknowledged.
      inverted: true
      ignore_strapping_warning: true

# I2C not connected to anything internal on the GL-S10
# https://esphome.io/components/i2c
# i2c:
#   sda: GPIO15 # WARNING GPIO15 is a strapping PIN and should only be used for I/O with care.
#   scl: GPIO13
#   scan: true

# https://esphome.io/components/interval
interval:
  - interval: 1s
    then:
      if:
        condition:
          # https://github.com/esphome/esphome/blob/dev/esphome/components/ethernet/ethernet_component.h
          lambda: return ethernet::global_eth_component->is_connected();
        then:
          - output.turn_on: ble_led
        else:
          - output.turn_off: ble_led
