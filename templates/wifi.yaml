# Required substitutions:
# device_name

# Optional substitutions:
# wifi_signal_update_interval (60s, drop it to a few seconds to survey placement)

# Required secrets:
# wifi_ssid
# wifi_password
# wifi_domain

# https://esphome.io/components/substitutions
substitutions:
  wifi_signal_update_interval: 60s

# https://esphome.io/components/wifi
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  reboot_timeout: 15min
  min_auth_mode: WPA2

# https://esphome.io/components/text_sensor
text_sensor:

  # https://esphome.io/components/text_sensor/wifi_info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
    ssid:
      name: "WiFi SSID"
    bssid:
      name: "WiFi BSSID"

# https://esphome.io/components/sensor
sensor:

  # https://esphome.io/components/sensor/wifi_signal
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: ${wifi_signal_update_interval}