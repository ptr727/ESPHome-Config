# Required substitutions:
# device_name
# device_friendly_name

# Konnected blaQ Garage Door Controller
# https://konnected.io/products/smart-garage-door-opener-blaq-myq-alternative
# https://github.com/konnected-io/konnected-esphome/blob/master/garage-door-GDOv2-Q.yaml
# https://github.com/konnected-io/konnected-esphome/tree/master/components/secplus_gdo

# Imports Konnected's full firmware package and surgically strips stock-provisioning concerns.

substitutions:
  # Used by garage-door-GDOv2-Q.yaml
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  # A per-device 0s disables the reboot loop that can let a Sec+ 1.0 UART glitch open the door.
  wifi_reboot_timeout: 15min
  # Overridden rather than removed, because upstream lambdas read the project macros.
  # ESPHOME_PROJECT_NAME and ESPHOME_PROJECT_VERSION exist only while esphome.project is set.
  project_name: "ptr727.${device_name}"
  # Remove project version
  project_version: "0.0.0"

# https://esphome.io/components/esphome
esphome:
  name: ${device_name}
  friendly_name: ${device_friendly_name}
  name_add_mac_suffix: false

# https://esphome.io/guides/configuration-types.html#local-packages
packages:
  # https://github.com/konnected-io/konnected-esphome/blob/master/garage-door-GDOv2-Q.yaml
  gdov2q: github://konnected-io/konnected-esphome/garage-door-GDOv2-Q.yaml
  api: !include api.yaml
  logger: !include logger.yaml
  ota: !include ota.yaml
  time: !include time.yaml

# Remove unwanted items included by gdov2q package
esp32_improv: !remove
dashboard_import: !remove
web_server: !remove
improv_serial: !remove
captive_portal: !remove
wifi:
  ap: !remove
  # Add wifi configuration back after removing AP mode
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret wifi_domain
  reboot_timeout: ${wifi_reboot_timeout}
  min_auth_mode: WPA2
logger:
  level: !remove
  logs: !remove

# Change uptime sensor to minutes
sensor:
  - id: !extend uptime_sensor
    name: "Uptime"
    unit_of_measurement: min
    filters:
      - lambda: return x / 60.0;

# Change version sensor name
text_sensor:
  - id: !extend esphome_version
    name: "Version"

# Add status sensor
binary_sensor:
  - platform: status
    name: "Status"